# Builds the Wasm web bundle and ships it to Netlify.
#
# The build happens here rather than on Netlify because Netlify's build image has
# no JDK, so `./gradlew` cannot run there. Netlify only receives the finished
# static files.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle itself runs on this JDK; the build's own jvmToolchain(21) is
      # already satisfied by it, so foojay has nothing to download.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web bundle
        env:
          # Read by the generateMapKeys task when local.properties is absent,
          # which it always is here — the file is gitignored.
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      # Fails loudly here rather than as a deployed 404, which is what Netlify
      # serves for an empty publish directory.
      - name: Check the bundle is where netlify.toml expects it
        run: |
          dist=composeApp/build/dist/wasmJs/productionExecutable
          test -f "$dist/index.html" || {
            echo "No index.html in $dist — the Gradle output path moved."
            find composeApp/build/dist -maxdepth 3 -type d
            exit 1
          }
          # Normally copied out of composeApp/src/wasmJsMain/resources/ by the
          # distribution task. Written here too so a change in how Kotlin copies
          # web resources cannot silently cost us deep-link routing.
          test -f "$dist/_redirects" || printf '/*  /index.html  200\n' > "$dist/_redirects"
          ls -lh "$dist"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli deploy \
            --prod \
            --dir composeApp/build/dist/wasmJs/productionExecutable \
            --message "$GITHUB_SHA"
