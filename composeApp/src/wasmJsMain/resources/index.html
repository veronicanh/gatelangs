<!doctype html>
<html lang="no">
<head>
    <meta charset="utf-8"/>
    <!-- viewport-fit=cover + user-scalable=no: this is opened on a phone and the
         canvas handles its own pan/zoom, so browser pinch-zoom must not fight it. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
    <meta name="theme-color" content="#101410"/>
    <title>Gatelangs</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #101410;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body></body>
</html>
